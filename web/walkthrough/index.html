<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ironwail-Go — Engine Walkthrough</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav id="rail" aria-label="Engine layers"></nav>
  <main id="main">
    <h1>Ironwail-Go Engine Walkthrough</h1>
    <div class="card" id="viewport-card">
      <div class="card-title">Viewport (WebGPU)</div>
      <canvas id="game" tabindex="0" style="width:100%;max-width:640px;height:360px;background:#000;"></canvas>
    </div>
    <div id="boot-status">Press Play to boot the engine, then inspect each layer.</div>
    <div id="controls" class="card"></div>
    <div id="timeline" class="mono"></div>
    <div id="panel"></div>
    <div class="card">
      <div class="card-title">Edict table (first 12)</div>
      <pre id="edicts" class="mono"></pre>
    </div>
  </main>
  <script src="load_wasm.js"></script>
  <script src="walkthrough.js"></script>
</body>
</html>
