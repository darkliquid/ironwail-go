[env]
TIMEOUT = "5"
CGO_ENABLED = "0"
TMPDIR = "{{config_root}}/.tmp"
[tools]
deno = "latest"
go = "1.26"
golangci-lint = "latest"
"go:golang.org/x/vuln/cmd/govulncheck" = "latest"
"go:golang.org/x/tools/cmd/stringer" = "latest"
"go:golang.org/x/tools/gopls" = "latest"
"go:github.com/kolkov/racedetector/cmd/racedetector" = "latest"

# Helper task - not meant to be run directly
[tasks.go-run]
description = "Run the ironwailgo binary (internal task)"
hide = true
run = """
if [ -z "${QUAKE_DIR:-}" ]; then
  echo "QUAKE_DIR is required" >&2
  exit 1
fi
go run ./cmd/ironwailgo -basedir "${QUAKE_DIR}"
"""

[tasks.clean-logs]
description = "Remove smoke test log files"
run = "rm -f smoke-*.log"

[tasks.smoke-menu]
description = "Smoke test: verify GoGPU menu startup works"
depends = ["clean-logs", "build"]
run = """
if [ -z "${QUAKE_DIR:-}" ]; then
  echo "QUAKE_DIR is required" >&2
  exit 1
fi
export WAYLAND_DISPLAY=
timeout ${TIMEOUT} ./ironwailgo -basedir "${QUAKE_DIR}" -loglvl INFO 2>&1 | tee smoke-menu.log || true
grep "FS mounted" smoke-menu.log
grep "QC loaded" smoke-menu.log
grep "menu active" smoke-menu.log
"""

[tasks.smoke-headless]
description = "Smoke test: verify headless mode works from the GoGPU build"
depends = ["clean-logs", "build"]
run = """
if [ -z "${QUAKE_DIR:-}" ]; then
  echo "QUAKE_DIR is required" >&2
  exit 1
fi
export WAYLAND_DISPLAY=
timeout ${TIMEOUT} ./ironwailgo -basedir "${QUAKE_DIR}" -headless -loglvl INFO 2>&1 | tee smoke-headless.log || true
grep "FS mounted" smoke-headless.log
grep "QC loaded" smoke-headless.log
grep "menu active" smoke-headless.log
"""

[tasks.smoke-map-start]
description = "Smoke test: verify GoGPU map spawning works"
depends = ["clean-logs", "build"]
run = """
if [ -z "${QUAKE_DIR:-}" ]; then
  echo "QUAKE_DIR is required" >&2
  exit 1
fi
export WAYLAND_DISPLAY=
timeout ${TIMEOUT} ./ironwailgo -basedir "${QUAKE_DIR}" -loglvl INFO +map start 2>&1 | tee smoke-map-start.log || true
grep "FS mounted" smoke-map-start.log
grep "QC loaded" smoke-map-start.log
grep "menu active" smoke-map-start.log
grep "server spawned map start" smoke-map-start.log
grep "Client state changed to Active" smoke-map-start.log
"""

[tasks.smoke-all]
description = "Run all smoke tests"
depends = ["smoke-menu", "smoke-headless", "smoke-map-start"]

[tasks.test]
description = "Run Go tests"
run = "go test ./..."

[tasks.race]
description = "Run Go tests with race detection (using racedetector)"
run = "racedetector test ./..."

[tasks.verify]
description = "Run core verification suite"
depends = ["test", "build"]

[tasks.verify-mod-sdk]
description = "E2E mod SDK check: scaffold each template kind and build/test it (slow; QC_E2E_BUILD gates it)"
run = "QC_E2E_BUILD=1 go test ./cmd/qcmod -run TestInitScaffoldBuilds -count=1"

[tasks.build-qbsp]
description = "Build the pure-Go map compiler (qbsp)"
run = "go build -o qbsp ./cmd/qbsp"

[tasks.build-vis]
description = "Build the pure-Go PVS calculator (vis)"
run = "go build -o vis ./cmd/vis"

[tasks.build-light]
description = "Build the pure-Go lightmap baker (light)"
run = "go build -o light ./cmd/light"

[tasks.map-build]
description = "Compile a map end-to-end: qbsp -> vis -> light (set MAP=name)"
depends = ["build-qbsp", "build-vis", "build-light"]
run = """
set -e
./qbsp -o ${MAP}.bsp ${MAP}.map
./vis -o ${MAP}.bsp ${MAP}.bsp
./light -lit -o ${MAP}.bsp ${MAP}.bsp
"""

[tasks.build-qgo]
depends = ["go-generate"]
description = "Build the QGo compiler"
run = "go build ./cmd/qgo"

[tasks.build-progs]
depends = ["build-qgo"]
description = "Build the progs.dat from QuakeGo sources"
run = "cd pkg/qgo/quakego && ../../../qgo"

[tasks.build]
depends = ["go-generate"]
description = "Build game binary"
run = "go build -o ironwailgo ./cmd/ironwailgo"

[tasks.build-wasm]
depends = ["go-generate"]
description = "Build WebAssembly binary (ironwail.wasm) + copy wasm_exec.js loader"
run = "mkdir -p web/bin && GOOS=js GOARCH=wasm go build -o web/bin/ironwail.wasm ./cmd/ironwailgo && cp \"$(go env GOROOT)/lib/wasm/wasm_exec.js\" web/"

[tasks.serve-wasm]
depends = ["build-wasm"]
description = "Serve WebAssembly deployment harness at http://localhost:8080"
run = "cd web && go run server.go"

[tasks.build-wasm-harness]
depends = ["go-generate"]
description = "Build pollable engine wasm for Deno tests (ironwail-harness.wasm) + copy wasm_exec.js"
run = "mkdir -p web/bin && GOOS=js GOARCH=wasm go build -o web/bin/ironwail-harness.wasm ./cmd/ironwailgo-harness && cp \"$(go env GOROOT)/lib/wasm/wasm_exec.js\" web/"

[tasks.test-deno]
depends = ["build-wasm-harness"]
description = "Run the Deno wasm-walkthrough test suite (webgpu_smoke + harness). Needs a pak; tries .tmp/pak0.pak then $PAK0_PATH"
run = "deno test -A --no-check web/deno-tests/"


[tasks.run]
depends = ["build"]
description = "Run game"
run = "./ironwailgo -basedir ${QUAKE_DIR}"

[tasks.parity-ref]
description = "Capture reference screenshots from C Ironwail (uses QUAKE_DIR + ./ironwail symlink)"
run = """
#!/usr/bin/env bash
set -euo pipefail
# Resolve Quake data dir: QUAKE_DIR env, else ./quake-data symlink, else error.
QUAKE_DIR="${QUAKE_DIR:-./quake-data}"
if [ ! -d "${QUAKE_DIR}" ]; then
  echo "QUAKE_DIR is required (set it, or run mise run setup-symlinks to create ./quake-data)" >&2
  exit 1
fi
QUAKE_DIR="$(cd "${QUAKE_DIR}" && pwd)"
# Resolve C Ironwail binary: ./ironwail symlink (source repo w/ Linux build dir).
IRONWAIL_BIN="${IRONWAIL_BIN:-}"
if [ -z "${IRONWAIL_BIN}" ] && [ -x ./ironwail/Linux/ironwail ]; then
  IRONWAIL_BIN="$(cd ./ironwail/Linux && pwd)/ironwail"
elif [ -z "${IRONWAIL_BIN}" ] && [ -x ./ironwail ]; then
  IRONWAIL_BIN="$(cd ./ironwail && pwd)"
fi
if [ ! -x "${IRONWAIL_BIN}" ]; then
  echo "C Ironwail binary not found: ${IRONWAIL_BIN:-<unset>} (expected ./ironwail/Linux/ironwail via the ./ironwail symlink)" >&2
  exit 1
fi
QUAKE_BASEDIR="${QUAKE_DIR}" IRONWAIL_BIN="${IRONWAIL_BIN}" go run ./tools/parity_screenshots reference
"""

[tasks.parity-go]
description = "Capture screenshots from the GoGPU parity build (uses QUAKE_DIR)"
depends = ["build"]
run = """
#!/usr/bin/env bash
set -euo pipefail
QUAKE_DIR="${QUAKE_DIR:-./quake-data}"
if [ ! -d "${QUAKE_DIR}" ]; then
  echo "QUAKE_DIR is required (set it, or run mise run setup-symlinks to create ./quake-data)" >&2
  exit 1
fi
QUAKE_BASEDIR="$(cd "${QUAKE_DIR}" && pwd)" go run ./tools/parity_screenshots go
"""

[tasks.parity-compare]
description = "Compare reference vs Go screenshots and fail on diffs/missing captures"
run = "go run ./tools/parity_screenshots compare"

[tasks.parity-all]
description = "Capture reference + GoGPU Go screenshots and compare them"
depends = ["build"]
run = """
#!/usr/bin/env bash
set -euo pipefail
QUAKE_DIR="${QUAKE_DIR:-./quake-data}"
if [ ! -d "${QUAKE_DIR}" ]; then
  echo "QUAKE_DIR is required (set it, or run mise run setup-symlinks to create ./quake-data)" >&2
  exit 1
fi
QUAKE_DIR="$(cd "${QUAKE_DIR}" && pwd)"
IRONWAIL_BIN="${IRONWAIL_BIN:-}"
if [ -z "${IRONWAIL_BIN}" ] && [ -x ./ironwail/Linux/ironwail ]; then
  IRONWAIL_BIN="$(cd ./ironwail/Linux && pwd)/ironwail"
elif [ -z "${IRONWAIL_BIN}" ] && [ -x ./ironwail ]; then
  IRONWAIL_BIN="$(cd ./ironwail && pwd)"
fi
if [ ! -x "${IRONWAIL_BIN}" ]; then
  echo "C Ironwail binary not found: ${IRONWAIL_BIN:-<unset>} (expected ./ironwail/Linux/ironwail via the ./ironwail symlink)" >&2
  exit 1
fi
QUAKE_BASEDIR="${QUAKE_DIR}" IRONWAIL_BIN="${IRONWAIL_BIN}" go run ./tools/parity_screenshots both
"""

[tasks.parity-transparency]
description = "Run cross-engine transparency parity test on test_transparency.bsp"
run = "./tasks/parity-transparency.sh"

[tasks.trace-vulkan]
description = "Capture Vulkan GPU trace with gfxrecon or RenderDoc"
run = "./tasks/gpu-trace/trace-vulkan.sh"

[tasks.trace-opengl]
description = "Capture OpenGL GPU trace from C Ironwail with apitrace or RenderDoc"
run = "./tasks/gpu-trace/trace-opengl.sh"

[tasks.trace-compare]
description = "Compare Vulkan and OpenGL GPU traces and generate side-by-side markdown report"
run = "python3 ./tasks/gpu-trace/trace-compare.py"

[tasks.build-parity-generator]
description = "Build the C-Go frame state reference generator utility"
run = "go build -o bin/parity_generator ./tools/parity_generator"

[tasks.build-bspdiag]
description = "Build the BSP diagnostic inspection CLI tool"
run = "go build -o bin/bspdiag ./cmd/bspdiag"

[tasks.build-bspgen]
description = "Build the standalone test BSP generator tool"
run = "go build -o bin/bspgen ./cmd/bspgen"

[tasks.generate-test-map]
description = "Generate test_transparency.bsp in game data dirs"
depends = ["build-bspgen"]
run = """
#!/usr/bin/env bash
set -euo pipefail
mkdir -p ./testdata ./quake-data/id1/maps
./bin/bspgen -o ./testdata/test_transparency.bsp
./bin/bspgen -o ./quake-data/id1/maps/test_transparency.bsp
if [ -n "${QUAKE_DIR:-}" ] && [ -d "${QUAKE_DIR}/id1/maps" ]; then
  ./bin/bspgen -o "${QUAKE_DIR}/id1/maps/test_transparency.bsp"
elif [ -d "/home/darkliquid/Games/Heroic/Quake Enhanced/id1/maps" ]; then
  ./bin/bspgen -o "/home/darkliquid/Games/Heroic/Quake Enhanced/id1/maps/test_transparency.bsp"
fi
"""


[tasks.profile-maps]
description = "Capture pprof CPU and heap profiles across qbj2 and qbj3 benchmark maps"
depends = ["build"]
run = "bash ./tasks/profile_maps.sh"


[tasks.parity-generate]
description = "Generate a reference state JSON dump for a specific demo from C Ironwail"
depends = ["build-parity-generator"]
run = """
#!/usr/bin/env bash
set -euo pipefail
if [ -z "$1" ]; then
  echo "Usage: mise run parity-generate <demo_name>" >&2
  exit 1
fi
# Resolve data + C binary via QUAKE_DIR / ./quake-data and ./ironwail symlinks
# (the generator itself also falls back to the symlinks, so this is just to
# prefer explicit env over hardcoded stale defaults).
export QUAKE_BASEDIR="${QUAKE_BASEDIR:-${QUAKE_DIR:-$([ -d ./quake-data ] && cd ./quake-data && pwd || true)}}"
if [ -z "${QUAKE_BASEDIR:-}" ]; then
  echo "QUAKE_DIR is required (set it, or run mise run setup-symlinks to create ./quake-data)" >&2
  exit 1
fi
export IRONWAIL_BIN="${IRONWAIL_BIN:-$([ -x ./ironwail/Linux/ironwail ] && (cd ./ironwail/Linux && pwd)/ironwail || true)}"
if [ -z "${IRONWAIL_BIN:-}" ]; then
  echo "C Ironwail binary not found (expected ./ironwail/Linux/ironwail via the ./ironwail symlink)" >&2
  exit 1
fi
./bin/parity_generator "$1"
"""

[tasks.go-generate]
hide = true
description = "Run go generate (internal task)"
run = "go generate ./..."

[tasks.lint]
description = "Run Go linting (golangci-lint + govulncheck)"
run = """
#!/usr/bin/env bash
set -euo pipefail
TMPDIR=/tmp golangci-lint run ./...
TMPDIR=/tmp govulncheck ./...
"""

[tasks.fmt]
description = "Format Go code"
run = "golangci-lint fmt ./..."

[tasks.setup-symlinks]
description = "Check/create symlinks for the C Ironwail repo and Quake data"
run = """
#!/usr/bin/env bash
set -euo pipefail

ok=0

check_link() {
  local name="$1" target="$2"
  if [ -L "$name" ]; then
    if [ -e "$name" ]; then
      echo "OK: $name -> $(readlink "$name")"
    else
      echo "BROKEN: $name -> $(readlink "$name") (target missing)"
      ok=1
    fi
  elif [ -e "$name" ]; then
    echo "NOT A SYMLINK: $name exists but is not a symlink"
    ok=1
  else
    echo "MISSING: $name (expected to symlink to $target)"
    ok=1
  fi
}

create_link() {
  local name="$1" target="$2"
  if [ -d "$target" ] || [ -f "$target" ]; then
    ln -s "$target" "$name"
    echo "CREATED: $name -> $target"
  else
    echo "CANNOT CREATE: $name -> $target (target does not exist)"
    ok=1
  fi
}

# Expected symlinks:
#   ./ironwail    -> ../ironwail      (C Ironwail source repo + binary)
#   ./quake-data  -> ../quake-data    (Quake game data: id1/pak0.pak, etc.)

# Allow override via env vars
IRONWAIL_SRC="${IRONWAIL_SRC:-../ironwail}"
QUAKE_DATA_SRC="${QUAKE_DATA_SRC:-../quake-data}"

for pair in "ironwail:${IRONWAIL_SRC}" "quake-data:${QUAKE_DATA_SRC}"; do
  name="${pair%%:*}"
  target="${pair##*:}"
  if [ -L "$name" ] || [ -e "$name" ]; then
    check_link "$name" "$target"
  else
    create_link "$name" "$target"
  fi
done

if [ "$ok" -ne 0 ]; then
  echo ""
  echo "Some symlinks are missing or broken."
  echo "Create them manually, e.g.:"
  echo "  ln -s /path/to/ironwail ironwail"
  echo "  ln -s /path/to/quake-data quake-data"
  echo ""
  echo "Or set IRONWAIL_SRC and QUAKE_DATA_SRC env vars and re-run."
  exit 1
fi

echo ""
echo "All symlinks OK. QUAKE_DIR can point at ./quake-data"
"""

[tasks.perf-gate]
description = "Run the steady-state per-frame allocation regression gate (plan 20.5)"
depends = ["build"]
run = "bash ./tasks/perf_gate.sh"

[tasks.parity-report]
description = "Compare parity screenshots and emit a structured JSON + markdown summary report (plan 14.3)"
depends = ["build"]
run = "go run ./tools/parity_screenshots report"

[tasks.doc-check]
description = "Lint docs: plan status lines, stale references, forbidden build tags (plan 26.4)"
run = "bash ./tasks/doc_check.sh"

[tasks.qcmod-test]
description = "Run the standalone QuakeGo mod test runner on its example mod (plan 25)"
run = "go run ./cmd/qcmod test ./cmd/qcmod/examplemod"

[tasks.qcmod-sim]
description = "Build the qcmod CLI (plan 25)"
run = "go build -o bin/qcmod ./cmd/qcmod"

[tasks.build-site]
description = "Build the GitHub Pages static site from the article markdown"
depends = ["go-generate"]
run = """
#!/usr/bin/env bash
set -euo pipefail
CGO_ENABLED=0 go build -o bin/sitegen ./tools/sitegen
./bin/sitegen
echo "Site built in site/"
"""
